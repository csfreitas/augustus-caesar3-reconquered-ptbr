name: Validate localization package

on:
  push:
  pull_request:

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile Python tools
        run: >-
          python -m py_compile
          generate_native_media_overlays.py
          generate_scenario_aliases.py
          reconquered_ptbr_native_media.py
          reconquered_ptbr_media.py
          tests/test_native_media_installer.py
      - name: Validate generated media companions
        run: python generate_native_media_overlays.py --check
      - name: Validate canonical scenario aliases
        run: python generate_scenario_aliases.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
